<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Crosslinker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <div id="header">
      <span class="logo">🎵</span>
      <span class="title">Music Crosslinker</span>
    </div>

    <!-- Setup view -->
    <div id="view-setup" class="hidden">
      <div class="setup-icon">⚙️</div>
      <p class="setup-title">Setup Required</p>
      <p class="setup-desc">Add your API keys to start identifying songs.</p>
      <button id="btn-open-settings">Open Settings</button>
    </div>

    <!-- Home view -->
    <div id="view-home" class="hidden">
      <button id="btn-listen">
        <span>🎵</span>
        <span>Listen & Identify</span>
      </button>
      <p id="listen-hint" class="btn-hint">Music playing nearby</p>
      <div id="listen-divider" class="divider">or</div>
      <button id="btn-speak" class="btn-secondary">
        <span>🎤</span>
        <span>Speak your description</span>
      </button>
      <p class="btn-hint">Song stuck in your head</p>
      <div class="divider">or</div>
      <textarea id="ai-input" placeholder="Type lyrics or describe the song..."></textarea>
      <button id="btn-find">Find Song</button>
    </div>

    <!-- Listening view -->
    <div id="view-listening" class="hidden">
      <div class="pulse-ring"></div>
      <p id="listen-status">Listening...</p>
      <button id="btn-cancel">Cancel</button>
    </div>

    <!-- Results view -->
    <div id="view-results" class="hidden">
      <div id="track-info">
        <div id="track-title">—</div>
        <div id="track-artist">—</div>
      </div>
      <div id="results-links"></div>
      <button id="btn-retry">Search Again</button>
    </div>

    <!-- Permission denied view -->
    <div id="view-denied" class="hidden">
      <div class="perm-icon">🚫</div>
      <p class="perm-title">Microphone Blocked</p>
      <p class="perm-desc">Paste this in your address bar to re-enable:</p>
      <p class="perm-url" id="perm-url-text"></p>
      <button id="btn-copy-url">Copy Link</button>
    </div>

    <!-- Error view -->
    <div id="view-error" class="hidden">
      <p id="error-msg">Could not identify the track.</p>
      <button id="btn-retry-error">Try Again</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
